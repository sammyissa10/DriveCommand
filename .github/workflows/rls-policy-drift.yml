# RLS Policy Drift
#
# Replays the repo's migrations in order and diffs the resulting expected RLS
# policy set against live pg_policy, exactly as `npm run audit:rls-policy-drift`
# does locally. This is the detector that would have caught quick-584's silent
# loss of 59 policies the day after it happened.
#
# quick-591 / Phase 0 Prompt 0.5 changed two things:
#   1. Runs on every pull request, not only on push to master.
#   2. The check itself no longer has a suppression baseline. Any missing or
#      unexpected policy exits 1 and fails the job. There is nothing to edit
#      to make a finding go away except a forward migration.
#
# STILL INERT WITHOUT A CREDENTIAL, AND THIS IS THE ONE REMAINING GAP.
# `RLS_AUDIT_DATABASE_URL` does not exist as a repository or organization
# secret. quick-585 deliberately did not create one and quick-591 did not
# either — minting a database credential is not something a task should do on
# its own. Until it exists the "Credential absent" step fires and the job
# passes without checking anything.
#
# That is the §3.5 failure mode this phase exists to remove, so it is a loud
# ::warning:: annotation on every pull request rather than the ::notice:: it
# used to be. It is deliberately NOT a hard failure: making it one would turn
# every pull request red today for a missing secret nobody asked for. Adding
# the secret is a human step — see docs/audits/policy-drift-gate.md.
#
# quick-598 — THE CHECK NOW VALIDATES POLICY BODIES, NOT ONLY NAMES.
# ------------------------------------------------------------------
# Until quick-598 this check diffed `(table, policy_name)` identity and nothing
# else. A policy whose `USING` was rewritten to `true` under its existing name
# left it reporting "MISSING: none / UNEXPECTED: none" — proven on staging, and
# the transcript is in docs/audits/phase-0-verification-gates.md.
#
# The definition layer compares every live policy body against the body its
# migration declares. The expected side is canonicalised BY POSTGRES (a
# `CREATE POLICY … pg_get_expr … ROLLBACK` round-trip on staging) and COMMITTED
# as `apps/web/scripts/audit/rls-policy-canonical.json`, which is why this job
# still needs no new credential and why its database access is still a pure
# SELECT with no transaction and no DDL.
#
# THREE EXIT CODES NOW:
#   0  CLEAN            — names and bodies agree.
#   1  DRIFT            — a policy is missing, unexpected, or its body differs.
#   3  DEFINITIONS NOT  — `rls-policy-canonical.json` is absent or STALE. The
#      CHECKED            run prints "DEFINITION LAYER DID NOT RUN" and never
#                         prints the word CLEAN.
#
# EXIT 3 IS WHAT YOU WILL HIT AFTER CHANGING A POLICY BODY IN A MIGRATION.
# The corpus hash changes, the committed artefact goes stale, and the fix is to
# run `npm run audit:rls-canonicalise` (staging only — it needs
# `apps/web/.env.staging`) and commit the regenerated artefact in the same
# change as the migration. Do not delete the artefact to make this green:
# without it the check reports that it checked nothing, which is the truth.

name: RLS Policy Drift

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  rls-policy-drift:
    name: RLS policy drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for read-only database credential
        id: cred
        env:
          RLS_AUDIT_DATABASE_URL: ${{ secrets.RLS_AUDIT_DATABASE_URL }}
        run: |
          if [ -n "$RLS_AUDIT_DATABASE_URL" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: RLS policy drift check
        if: steps.cred.outputs.present == 'true'
        working-directory: apps/web
        run: npm run audit:rls-policy-drift
        env:
          # _bootstrap-env.ts only repoints DATABASE_URL at DIRECT_URL when
          # DIRECT_URL is present. Leaving DIRECT_URL unset here means the
          # secret below is the connection actually used, unmodified.
          DATABASE_URL: ${{ secrets.RLS_AUDIT_DATABASE_URL }}

      - name: Credential absent — check DID NOT RUN
        if: steps.cred.outputs.present != 'true'
        run: |
          echo "::warning title=RLS policy drift check DID NOT RUN::RLS_AUDIT_DATABASE_URL is not configured, so no drift check was performed. A green tick on this job does NOT mean the RLS policies are intact - it means nothing was checked. This is the exact failure mode that let 59 policies vanish unnoticed for three months. Add a read-only Postgres connection string as the RLS_AUDIT_DATABASE_URL secret to arm it. See docs/audits/policy-drift-gate.md."
          echo ""
          echo "=================================================================="
          echo " RLS POLICY DRIFT CHECK DID NOT RUN — NO CREDENTIAL"
          echo "=================================================================="
          echo " A passing job here is not evidence of anything."
          echo " Add secret RLS_AUDIT_DATABASE_URL to arm this gate."
          echo "=================================================================="
