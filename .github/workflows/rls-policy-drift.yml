# RLS Policy Drift
#
# quick-585. This check is inert today. `RLS_AUDIT_DATABASE_URL` does not
# exist as a repository/organization secret, and quick-585 deliberately did
# NOT create one — creating a credential was explicitly out of scope for
# that task (see docs/diagnostics/rls-policy-drift-detector.md §5, "CI
# credential gap"). Until a read-only Postgres connection string is added
# under that name, the "Credential absent" step below fires on every run,
# emits a GitHub notice, and exits 0 — the build never fails for a missing
# credential.
#
# What it does once the secret exists: replays the repo's migrations
# in order and diffs the resulting expected RLS policy set against live
# pg_policy, exactly as `npm run audit:rls-policy-drift` does locally. This
# is the detector that would have caught quick-584's silent loss of 59
# policies the day after it happened.

name: RLS Policy Drift

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  rls-policy-drift:
    name: RLS policy drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for read-only database credential
        id: cred
        env:
          RLS_AUDIT_DATABASE_URL: ${{ secrets.RLS_AUDIT_DATABASE_URL }}
        run: |
          if [ -n "$RLS_AUDIT_DATABASE_URL" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: RLS policy drift check
        if: steps.cred.outputs.present == 'true'
        working-directory: apps/web
        run: npm run audit:rls-policy-drift
        env:
          # _bootstrap-env.ts only repoints DATABASE_URL at DIRECT_URL when
          # DIRECT_URL is present. Leaving DIRECT_URL unset here means the
          # secret below is the connection actually used, unmodified.
          DATABASE_URL: ${{ secrets.RLS_AUDIT_DATABASE_URL }}

      - name: Credential absent — check skipped
        if: steps.cred.outputs.present != 'true'
        run: |
          echo "::notice title=RLS policy drift check skipped::RLS_AUDIT_DATABASE_URL is not configured as a repository secret, so the RLS policy drift check did not run. See docs/diagnostics/rls-policy-drift-detector.md for what is needed to enable it. This step does not fail the build."
